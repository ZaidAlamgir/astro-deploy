name: Build Astro Site and Deploy to GitLab Pages

on:
  repository_dispatch:
    types: [new-article-post]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 2. Clone Website Source Code from GitLab
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          git clone --branch source "https://oauth2:${GITLAB_PAT}@gitlab.com/themuslimpost/website-host-astro.git" ./main_site

      - name: 3. Create Content Staging Directories
        run: |
          mkdir -p ./main_site/src/content/news
          mkdir -p ./_article_repos

      # --- CHECKOUT CONTENT REPOS FROM GITHUB ORG (same as Jekyll workflow) ---
      - name: 4. Checkout World Politics
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-world-politics
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/world-politics

      - name: 5. Checkout Indian Politics
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-indian-politics
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/indian-politics

      - name: 6. Checkout Muslim World
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-muslim-world
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/muslim-world

      - name: 7. Checkout Technology
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-technology
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/technology

      - name: 8. Checkout Medical Science
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-medical-science
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/medical-science

      - name: 9. Checkout Global Economy
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-global-economy
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/global-economy

      - name: 10. Checkout Art & Culture
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-art-culture
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/art-culture

      - name: 11. Checkout Weather
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-weather
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/weather

      - name: 12. Checkout Sports
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-sports
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/sports

      - name: 13. Checkout National News
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-national-news
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/national-news

      - name: 14. Checkout International News
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-international-news
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/international-news

      - name: 15. Checkout User Archives
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-user-archives
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/user-archives

      - name: 16. Checkout History
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-history
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/history

      - name: 17. Checkout Indian Muslims
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-indian-muslims
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/indian-muslims

      - name: 18. Checkout Middle East
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-middle-east
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/middle-east

      - name: 19. Checkout Climate
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-climate
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/climate

      - name: 20. Checkout Defense
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-defense
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/defense

      - name: 21. Checkout South Asia
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-south-asia
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/south-asia

      - name: 22. Checkout Africa
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-africa
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/africa

      - name: 23. Checkout Europe
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-europe
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/europe

      - name: 24. Checkout Central Asia
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-central-asia
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/central-asia

      - name: 25. Checkout Crime Alert
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-crime-alert
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/crime-alert

      - name: 26. Checkout South East Asia
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-south-east-asia
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/south-east-asia

      - name: 27. Checkout East Asia
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-east-asia
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/east-asia

      - name: 28. Checkout North America
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-north-america
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/north-america

      - name: 29. Checkout South America
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-south-america
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/south-america

      # --- CONSOLIDATION ---
      - name: 30. Consolidate All Posts into Astro Content
        run: |
          for dir in ./_article_repos/*/; do
            dir_name=$(basename "$dir")
            if [ -d "$dir/posts" ]; then
              echo "Copying posts from $dir_name..."
              cp -r "$dir/posts"/. ./main_site/src/content/news/
            fi
          done
          if [ -d "./_article_repos/user-archives/_posts" ]; then
            echo "Copying user archives..."
            cp -r "./_article_repos/user-archives/_posts/." ./main_site/src/content/news/
          fi
          echo "--- Verification: Files in src/content/news ---"
          ls ./main_site/src/content/news/ | head -20

      # --- BUILD ---
      - name: 31. Install Dependencies
        working-directory: ./main_site
        run: npm ci

      - name: 32. Build Astro Site
        working-directory: ./main_site
        run: npm run build

      # --- DEPLOY ---
      - name: 33. Prepare Deploy Directory
        run: |
          mkdir -p ./deploy_dir
          mv ./main_site/dist ./deploy_dir/public

      - name: 34. Create .gitlab-ci.yml for GitLab Pages
        run: |
          cat << 'EOF' > ./deploy_dir/.gitlab-ci.yml
          pages:
            stage: deploy
            script:
              - echo "Publishing pre-built site..."
            artifacts:
              paths:
                - public
          EOF

      - name: 35. Force Push Compiled Site to GitLab main
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          cd ./deploy_dir
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy Astro site compiled by GitHub Actions"
          git push --force "https://oauth2:${GITLAB_PAT}@gitlab.com/themuslimpost/website-host-astro.git" HEAD:main
